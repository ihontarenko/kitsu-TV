# The television app's version — the ONLY place it is written.
#
# THREE THINGS, AND ONLY ONE IS STAMPED BY THE SCRIPT.
#
# major.minor.patch is the VERSION — what changed, raised by hand when something did. It may go DOWN
# (it was reset from 1.7.0 to 1.0.0 on 2026-09-25): nothing compares versions.
#
# release is the BUILD of it: YYYYMMDDNNN, the date and that day's counter. `./build-apk.sh` stamps it
# on every release build — today's date and 001, or the next number when today already has one — so a
# forgotten detail shipped as 1.7.0 goes out again as 1.7.0 with a bigger release, not as 1.7.1.
#
# codeName is the build's name for people — "Stable" unless `./build-apk.sh --code-name "x-mas build"`
# says otherwise for that one build (the flag is not written back here). Any words; it is a label and
# nothing reads meaning into it.
#
# ⚠️ THIS FILE IS UTF-8 AND AN EMOJI IN THE CODE NAME IS FINE — but only since 2026-09-29, when
# `app/build.gradle.kts` started handing `Properties.load` a Reader. Given a stream it decodes
# ISO-8859-1, so anything but ASCII reached versionName as mojibake while the build script, which
# reads this file as UTF-8, printed it correctly. If a name ever looks right in the terminal and wrong
# on the About screen, that is the line to check.
#
# ⚠️ AN UPDATE IS A BIGGER RELEASE, AND NOTHING ELSE. versionCode — what the server orders releases by
# (AndroidReleases) and what a television compares against its own to offer an update — is derived
# from the RELEASE, not from the version:
# release − 20000000000, so 20260925002 becomes 260925002. Android keeps versionCode in a 32-bit int
# (at most 2147483647); the full eleven digits do not fit, the last nine do, until the year 2121.
# So a newer release is ALWAYS a newer code, whatever the version says.
#
# versionName carries all three, in the one shape the server parses (ReleaseLabel in the backend):
# "1.0.0 · 20260925004 · Stable". It is also what Android's own app settings show. The television
# reads its own parts from BuildConfig, never by parsing its versionName.
major=1
minor=2
patch=6
codeName=bbq-time 🍖
release=20261002004
