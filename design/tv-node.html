<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitsu TV — Inside a genre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tv.css">
  <style>
    /*
      What is filed under one node — one genre, or one collection.

      ⚠️ THE SAME PAGE FOR BOTH, and the eyebrow is the only thing that differs. They are picked the
      same way and read the same way; only the fetch behind them differs, and a household has no
      business being able to feel that.

      ⚠️ IT IS AN ADDRESS, NOT A STATE. Reaching this could have swapped the contents of the shelf
      above and kept a flag for "am I inside one". Making it a page instead means BACK is the
      platform's, the bay above stays lit, and nothing has to think about the remote's back button —
      which is the sort of thing that is only ever got wrong by hand.

      ⚠️ AND THERE IS NO GENRE RAIL HERE, unlike `tv-films.html`. The rail is for narrowing a large
      shelf while staying on it; this page IS the narrowing, and a rail would offer a second way to
      do what BACK already does, one row away from the titles.

      ⚠️ NO SORT CHIPS EITHER, and that is the one real asymmetry with the catalogue. A genre is
      sorted by name because somebody arriving here is looking for a title they have in mind; a
      collection keeps the order it was arranged in, which is the only thing that made it a
      collection. Offering "Added · Title · Year · Rating" would quietly throw the second away.
     */
    .shelf {
      padding: var(--space-7) var(--tv-gutter) var(--space-9);
    }

    /* ⚠️ THE COUNT SITS ON THE HEADING BASELINE, which is why the row holds the h1 and the count
       and NOT the eyebrow. A flex item aligns on its FIRST baseline, so a row of
       [eyebrow + h1] and [count] hangs the number off the eyebrow, a line and a half too high. */
    .shelf__head {
      margin-bottom: var(--space-6);
    }

    .shelf__title {
      display: flex;
      align-items: baseline;
      gap: var(--space-4);
    }

    .shelf__head h1 {
      font-size: var(--text-h1);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    .shelf__count {
      font-size: var(--text-h2);
      color: var(--kt-fg-subtle);
    }

    /* ⚠️ The crumb is the BAY plus the node, in that order — the same two words the deck and the
       heading already say. It exists because a television has no address bar, and somebody who
       arrived here from the Home rail rather than from Genres has otherwise no way to know that
       BACK leads to a wall of genres. */
    .shelf__whence {
      margin-bottom: var(--space-2);
    }
  </style>
</head>
<body>
  <div class="tv-screen">

    <header class="tv-deck">
      <div class="tv-brand" aria-label="Kitsu">
        <span class="tv-brand__mark" aria-hidden="true"></span>
        <span><span class="tv-brand__soft">media</span>hub</span>
      </div>
      <nav class="tv-bays" aria-label="Bays" data-row>
        <a class="tv-bay tv-focus" href="tv-home.html">Home</a>
        <a class="tv-bay tv-focus" href="tv-films.html">Films</a>
        <a class="tv-bay tv-focus" href="tv-title.html">Series</a>
        <a class="tv-bay tv-focus" href="tv-collections.html">Collections</a>
        <!-- ⚠️ The bay stays lit while inside a node, so the deck keeps saying where this is. -->
        <a class="tv-bay tv-focus" href="tv-genres.html" aria-current="page">Genres</a>
        <a class="tv-bay tv-focus" href="tv-favourites.html">Favourites</a>
        <a class="tv-bay tv-focus" href="tv-search.html">Search</a>
      </nav>
      <div class="tv-deck__status">
        <span class="tv-deck__server">IVAN-PC</span>
        <a class="tv-avatar tv-focus" href="tv-profiles.html" aria-label="Profile: Home. Switch profile">HO</a>
      </div>
    </header>

    <main class="tv-main shelf">
      <div class="shelf__head">
        <p class="tv-eyebrow shelf__whence">Genre</p>
        <div class="shelf__title">
          <h1>Science Fiction</h1>
          <p class="shelf__count">3 titles</p>
        </div>
      </div>

      <ul class="tv-wall" role="list" aria-label="Titles in Science Fiction">
        <li>
          <a class="tv-tile" href="tv-title.html" autofocus>
            <span class="tv-tile__frame"><img src="https://image.tmdb.org/t/p/w342/yQvGrMoipbRoddT0ZR8tPoR7NfX.jpg" alt=""></span>
            <span class="tv-tile__caption"><span class="tv-tile__name">Interstellar</span><span class="tv-tile__meta"><span>2014</span><span class="tv-rating">★ 8.5</span></span></span>
          </a>
        </li>
        <li>
          <a class="tv-tile" href="tv-title.html">
            <span class="tv-tile__frame">
              <img src="https://image.tmdb.org/t/p/w342/xlaY2zyzMfkhk0HSC5VUwzoZPU1.jpg" alt="">
              <span class="tv-tile__overlay"><span class="tv-progress" aria-hidden="true"><span style="width: 81%"></span></span></span>
            </span>
            <span class="tv-tile__caption"><span class="tv-tile__name">Inception</span><span class="tv-tile__meta"><span>2010</span><span class="tv-rating">★ 8.4</span></span></span>
          </a>
        </li>
        <li>
          <a class="tv-tile" href="tv-title.html">
            <span class="tv-tile__frame"><img src="https://image.tmdb.org/t/p/w342/dXNAPwY7VrqMAo51EKhhCJfaGb5.jpg" alt=""></span>
            <span class="tv-tile__caption"><span class="tv-tile__name">The Matrix</span><span class="tv-tile__meta"><span>1999</span><span class="tv-rating">★ 8.3</span></span></span>
          </a>
        </li>
      </ul>
    </main>
  </div>
  <a hidden data-back="tv-genres.html"></a>
  <script src="tv.js"></script>
</body>
</html>
